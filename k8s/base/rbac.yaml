apiVersion: v1
kind: ServiceAccount
metadata:
  name: memleak-app
  namespace: memleak
automountServiceAccountToken: false   # the app never talks to the Kubernetes API
---
# Least privilege: read ONLY the app's own ConfigMap (no list/watch, no secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memleak-app-reader
  namespace: memleak
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["memleak-app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memleak-app-reader
  namespace: memleak
subjects:
  - kind: ServiceAccount
    name: memleak-app
    namespace: memleak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memleak-app-reader
