apiVersion: v1
kind: ResourceQuota
metadata:
  name: memleak-quota
  namespace: memleak
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi     # 3 pods x 400Mi = 1.2Gi, leaves headroom for restarts/rollouts
    configmaps: "10"
    secrets: "10"
    services: "5"
---
# Defaults so that any pod without explicit sizing still gets bounded
apiVersion: v1
kind: LimitRange
metadata:
  name: memleak-limits
  namespace: memleak
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 400Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        memory: 512Mi
