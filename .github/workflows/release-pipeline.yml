name: Release Pipeline

# Runs only when changes land on main (i.e. a PR was merged).
# paths-ignore on k8s/ stops the manifest-bump commit from retriggering this workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "**.md"
      - "docs/**"

permissions:
  contents: write     # commit the new image tag back to the repo
  packages: write     # push to GHCR

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, push & bump manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute image name and tag
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER}/memleak-app" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image per Python version -> three Deployments in the cluster
      - name: Build & push py3.11
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PYTHON_VERSION=3.11
          tags: ${{ steps.meta.outputs.image }}:py3.11-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=py3.11
          cache-to: type=gha,mode=max,scope=py3.11
          provenance: true
          sbom: true

      - name: Build & push py3.12
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PYTHON_VERSION=3.12
          tags: ${{ steps.meta.outputs.image }}:py3.12-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=py3.12
          cache-to: type=gha,mode=max,scope=py3.12
          provenance: true
          sbom: true

      - name: Build & push py3.13
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PYTHON_VERSION=3.13
          tags: ${{ steps.meta.outputs.image }}:py3.13-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=py3.13
          cache-to: type=gha,mode=max,scope=py3.13
          provenance: true
          sbom: true

      - name: Update image tags in Kustomize manifest
        env:
          IMG: ${{ steps.meta.outputs.image }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for v in 311 312 313; do
            tag="py${v:0:1}.${v:1}-${SHA}"
            NAME="memleak-app-py${v}" TAG="$tag" \
              yq -i '(.images[] | select(.name == env(NAME))) |= (.newName = strenv(IMG) | .newTag = strenv(TAG))' \
              k8s/base/kustomization.yaml
          done
          cat k8s/base/kustomization.yaml

      - name: Commit and push manifest change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git diff --cached --quiet && { echo "No manifest change"; exit 0; }
          git commit -m "ci: deploy ${{ steps.meta.outputs.sha }} [skip ci]"
          git push origin HEAD:main
