name: Cluster Verify (kind)

# Manual-only. Builds a throwaway kind cluster on a GitHub-hosted runner and verifies the
# whole stack end to end: ArgoCD sync, Service load-balancing, NetworkPolicy, OOMKilled at 400Mi,
# Prometheus / Grafana / Loki, dashboard + alert provisioning, and that the OOM alert fires.
# Evidence (logs, JSON, screenshots) is uploaded as the "cluster-evidence" artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  KIND_CLUSTER: memleak
  GRAFANA_AUTH: admin:admin-change-me

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster (Calico CNI so NetworkPolicies are enforced)
        run: |
          mkdir -p evidence
          if ! command -v kind >/dev/null; then
            sudo curl -fsSLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            sudo chmod +x /usr/local/bin/kind
          fi
          cat > /tmp/kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          EOF
          kind create cluster --name "$KIND_CLUSTER" --config /tmp/kind.yaml
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes -o wide

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          # not needed for this demo; saves memory on the runner
          kubectl -n argocd scale deploy argocd-dex-server argocd-notifications-controller argocd-applicationset-controller --replicas=0
          kubectl -n argocd rollout status deploy/argocd-redis --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s

      - name: Deploy app through ArgoCD (GitOps sync)
        run: |
          sed "s#YOUR_GH_USER/YOUR_REPO#${GITHUB_REPOSITORY}#" argocd/application.yaml | kubectl apply -f -
          s=""
          for i in $(seq 1 60); do
            s=$(kubectl -n argocd get application memleak-app -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            echo "sync status: ${s:-<none>}"
            [ "$s" = "Synced" ] && break
            sleep 10
          done
          kubectl -n argocd get application memleak-app -o yaml > evidence/argocd-application.yaml || true
          [ "$s" = "Synced" ]

      - name: Wait for the 3 app pods to be Ready
        run: |
          for i in $(seq 1 30); do
            n=$(kubectl -n memleak get pods -l app=memleak-app --no-headers 2>/dev/null | wc -l)
            [ "$n" -ge 3 ] && break
            sleep 5
          done
          kubectl -n memleak wait --for=condition=Ready pod -l app=memleak-app --timeout=300s
          kubectl -n memleak get pods -o wide

      - name: "Check: one Service fronts all 3 Deployments"
        id: svc
        continue-on-error: true
        run: |
          n=$(kubectl -n memleak get endpoints memleak-app -o jsonpath='{.subsets[*].addresses[*].ip}' | wc -w)
          echo "ready endpoints behind Service memleak-app: $n"
          kubectl -n memleak get endpoints memleak-app -o yaml > evidence/service-endpoints.yaml
          [ "$n" -eq 3 ]

      - name: "Check: default-deny NetworkPolicy blocks other namespaces"
        id: netpol
        continue-on-error: true
        run: |
          if kubectl run np-test -n default --image=curlimages/curl --restart=Never --rm -i --quiet \
               --command -- curl -m 5 -s http://memleak-app.memleak.svc.cluster.local/healthcheck; then
            echo "UNEXPECTED: traffic from default namespace was allowed"
            exit 1
          else
            echo "blocked as expected" | tee evidence/networkpolicy-blocked.txt
          fi

      - name: Install monitoring (Prometheus, Grafana, Loki, Alloy)
        run: bash scripts/03-install-monitoring.sh

      - name: Port-forward Grafana, Prometheus, Loki
        run: |
          nohup kubectl -n monitoring port-forward svc/kps-grafana 3000:80 >/tmp/pf-grafana.log 2>&1 &
          nohup kubectl -n monitoring port-forward svc/kps-kube-prometheus-stack-prometheus 9090:9090 >/tmp/pf-prom.log 2>&1 &
          nohup kubectl -n monitoring port-forward svc/loki 3100:3100 >/tmp/pf-loki.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/api/health && break
            sleep 5
          done
          curl -fsS localhost:3000/api/health

      - name: "Check: pods are OOMKilled at the 400Mi limit"
        id: oom
        continue-on-error: true
        run: |
          kubectl -n memleak get pods -o custom-columns=POD:.metadata.name,REQ:.spec.containers[0].resources.requests.memory,LIMIT:.spec.containers[0].resources.limits.memory | tee evidence/pod-resources.txt
          for l in $(kubectl -n memleak get pods -o jsonpath='{.items[*].spec.containers[0].resources.limits.memory}'); do
            [ "$l" = "400Mi" ]
          done
          n=0
          for i in $(seq 1 48); do
            n=$(kubectl -n memleak get pods -o jsonpath='{range .items[*]}{.status.containerStatuses[0].lastState.terminated.reason}{"\n"}{end}' | grep -c OOMKilled || true)
            echo "pods with last state OOMKilled: $n/3"
            [ "$n" -ge 3 ] && break
            sleep 10
          done
          kubectl -n memleak get pods -o wide | tee evidence/pods-after-oom.txt
          kubectl -n memleak describe pods | grep -B1 -A8 "Last State" > evidence/pods-last-state.txt || true
          [ "$n" -ge 3 ]

      - name: "Check: Grafana dashboard, datasources, alert rules, contact point"
        id: grafana
        continue-on-error: true
        run: |
          A="$GRAFANA_AUTH"
          curl -fsS -u "$A" "localhost:3000/api/search?query=Memleak" | tee evidence/grafana-dashboards.json | jq -e 'length>0'
          curl -fsS -u "$A" localhost:3000/api/datasources | tee evidence/grafana-datasources.json | jq -e '[.[].name] | contains(["Loki","Prometheus"])'
          ok=0
          for i in $(seq 1 24); do
            curl -fsS -u "$A" localhost:3000/api/v1/provisioning/alert-rules > evidence/grafana-alert-rules.json || true
            if jq -e '[.[].title] | contains(["MemleakOOMKilled","MemleakPodNotReady","MemleakDeploymentUnavailable"])' evidence/grafana-alert-rules.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          curl -fsS -u "$A" localhost:3000/api/v1/provisioning/contact-points | tee evidence/grafana-contact-points.json | jq -e '[.[].name] | contains(["slack-sre"])'

      - name: "Check: Prometheus sees the OOMKilled pods and their memory"
        id: prom
        continue-on-error: true
        run: |
          q() { curl -fsS -G localhost:9090/api/v1/query --data-urlencode "query=$1"; }
          c=0
          for i in $(seq 1 36); do
            q 'kube_pod_container_status_last_terminated_reason{namespace="memleak",reason="OOMKilled"} == 1' > evidence/prom-oomkilled.json || true
            c=$(jq '.data.result|length' evidence/prom-oomkilled.json 2>/dev/null || echo 0)
            echo "OOMKilled series: $c"
            [ "${c:-0}" -ge 1 ] && break
            sleep 10
          done
          q 'container_memory_working_set_bytes{namespace="memleak",container="app"}' > evidence/prom-memory.json
          jq -e '.data.result|length>0' evidence/prom-memory.json
          [ "${c:-0}" -ge 1 ]

      - name: "Check: Loki has the application logs"
        id: loki
        continue-on-error: true
        run: |
          c=0
          for i in $(seq 1 36); do
            curl -fsS -G localhost:3100/loki/api/v1/query_range --data-urlencode 'query={namespace="memleak"}' --data-urlencode 'limit=20' > evidence/loki-logs.json || true
            c=$(jq '[.data.result[].values|length]|add // 0' evidence/loki-logs.json 2>/dev/null || echo 0)
            echo "log lines returned: $c"
            [ "${c:-0}" -ge 1 ] && break
            sleep 10
          done
          [ "${c:-0}" -ge 1 ]

      - name: "Check: Grafana alert MemleakOOMKilled is firing"
        id: alert
        continue-on-error: true
        run: |
          st="none"
          for i in $(seq 1 36); do
            curl -fsS -u "$GRAFANA_AUTH" localhost:3000/api/prometheus/grafana/api/v1/rules > evidence/grafana-rule-states.json || true
            st=$(jq -r '[.data.groups[].rules[] | select(.name=="MemleakOOMKilled") | .state][0] // "none"' evidence/grafana-rule-states.json 2>/dev/null || echo none)
            echo "MemleakOOMKilled state: $st"
            [ "$st" = "firing" ] && break
            sleep 10
          done
          [ "$st" = "firing" ]

      - name: Screenshot Grafana dashboard and alert list
        id: shots
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null && npm i playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/pw/shot.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              viewport: { width: 1600, height: 2300 },
              extraHTTPHeaders: { Authorization: 'Basic ' + Buffer.from('admin:admin-change-me').toString('base64') },
            });
            const p = await ctx.newPage();
            await p.goto('http://localhost:3000/d/memleak-sre/memleak-sre-overview?orgId=1&from=now-15m&to=now&kiosk', { waitUntil: 'domcontentloaded' });
            await p.waitForTimeout(25000);
            await p.screenshot({ path: process.env.OUT + '/grafana-dashboard.png' });
            await p.goto('http://localhost:3000/alerting/list', { waitUntil: 'domcontentloaded' });
            await p.waitForTimeout(10000);
            await p.screenshot({ path: process.env.OUT + '/grafana-alerts.png' });
            await b.close();
          })();
          EOF
          OUT="$GITHUB_WORKSPACE/evidence" node /tmp/pw/shot.js

      - name: Diagnostics (only when something failed)
        if: failure()
        run: |
          mkdir -p evidence
          {
            echo "=== pods (all namespaces)";            kubectl get pods -A -o wide
            echo; echo "=== describe argocd pods";       kubectl -n argocd describe pods
            echo; echo "=== redis logs (all containers)"; kubectl -n argocd logs deploy/argocd-redis --all-containers --tail=80 --prefix
            echo; echo "=== redis secret-init logs";     kubectl -n argocd logs deploy/argocd-redis -c secret-init --tail=80
            echo; echo "=== monitoring pods";            kubectl -n monitoring get pods -o wide
            echo; echo "=== describe loki pods";          kubectl -n monitoring describe pods -l app.kubernetes.io/name=loki
            echo; echo "=== loki logs (all containers)";  kubectl -n monitoring logs -l app.kubernetes.io/name=loki --all-containers --tail=80 --prefix
            echo; echo "=== loki previous logs";          kubectl -n monitoring logs -l app.kubernetes.io/name=loki --all-containers --previous --tail=80 --prefix
            echo; echo "=== helm releases";               helm list -A
            echo; echo "=== kube-system pods";           kubectl -n kube-system get pods -o wide
            echo; echo "=== calico-node logs";           kubectl -n kube-system logs ds/calico-node --tail=40
            echo; echo "=== events (last 80)";           kubectl get events -A --sort-by=.lastTimestamp | tail -80
            echo; echo "=== node resources";            kubectl describe nodes | tail -40
          } > evidence/diagnostics.txt 2>&1 || true
          cat evidence/diagnostics.txt

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          kubectl get pods -A -o wide > evidence/all-pods.txt || true
          kubectl -n memleak get all,netpol,resourcequota,limitrange,sa,role,rolebinding,cm,pdb -o wide > evidence/memleak-resources.txt || true
          kubectl -n memleak logs -l app=memleak-app --tail=30 --prefix > evidence/app-logs.txt || true
          kubectl -n memleak get events --sort-by=.lastTimestamp > evidence/events.txt || true
          kubectl -n argocd get application memleak-app > evidence/argocd-app-status.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-evidence
          path: evidence/
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          R_SVC: ${{ steps.svc.outcome }}
          R_NETPOL: ${{ steps.netpol.outcome }}
          R_OOM: ${{ steps.oom.outcome }}
          R_GRAFANA: ${{ steps.grafana.outcome }}
          R_PROM: ${{ steps.prom.outcome }}
          R_LOKI: ${{ steps.loki.outcome }}
          R_ALERT: ${{ steps.alert.outcome }}
          R_SHOTS: ${{ steps.shots.outcome }}
        run: |
          {
            echo "## Cluster verification"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| One Service load-balances across 3 Deployments | $R_SVC |"
            echo "| NetworkPolicy default-deny blocks other namespaces | $R_NETPOL |"
            echo "| Pods OOMKilled at 400Mi limit | $R_OOM |"
            echo "| Grafana dashboard, datasources, alert rules, contact point | $R_GRAFANA |"
            echo "| Prometheus sees OOMKilled + memory metrics | $R_PROM |"
            echo "| Loki has app logs | $R_LOKI |"
            echo "| MemleakOOMKilled alert firing | $R_ALERT |"
            echo "| Screenshots captured | $R_SHOTS |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for r in "$R_SVC" "$R_NETPOL" "$R_OOM" "$R_GRAFANA" "$R_PROM" "$R_LOKI" "$R_ALERT" "$R_SHOTS"; do
            [ "$r" = "success" ] || fail=1
          done
          exit $fail
